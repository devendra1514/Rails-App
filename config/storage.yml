test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

amazon:
  service: S3
  access_key_id: <%= AppConfig.dig(:aws, :access_key_id) %>
  secret_access_key: <%= AppConfig.dig(:aws, :secret_access_key) %>
  region: <%= AppConfig.dig(:aws, :region) %>
  bucket: <%= AppConfig.dig(:aws, :bucket) %>
  <% if AppConfig.dig(:aws, :endpoint).present? %>
  endpoint: <%= AppConfig.dig(:aws, :endpoint) %>
  force_path_style: true
  <% end %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

