name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint_and_security:
    name: Code Quality & Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true

      - name: Lint Ruby with RuboCop
        run: bundle exec rubocop

      - name: Security scan with Brakeman
        run: bundle exec brakeman -q --no-pager

      - name: Audit gem dependencies with Bundler-Audit
        run: bundle exec bundler-audit check --update --ignore CVE-2026-54659

  test_suite:
    name: RSpec Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true

      - name: Setup Database
        run: bin/rails db:prepare

      - name: Run RSpec Tests
        run: bundle exec rspec
